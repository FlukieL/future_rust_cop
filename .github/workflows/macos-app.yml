name: macOS app

# every push: the app of that commit, as the run's build result (Actions, the run, Artifacts)
on:
  push:
    branches: ['**']
  workflow_dispatch:

# a newer push on the same branch makes the older run unneeded
concurrency:
  group: macos-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the app
        run: ./tools/macos-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: fcop-macos-app-${{ github.sha }}
          path: target/fcop-*-macos.zip
